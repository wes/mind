name: Build

# Catches breakage before it reaches main. Deliberately secret-free so that it
# runs identically on a pull request from a fork: it builds an ad-hoc signed
# bundle and checks it holds together. Signing and notarization happen in
# release.yml, which only runs on this repository.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest installed Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$LATEST" ]]; then sudo xcode-select -switch "$LATEST"; fi
          swift --version

      - name: Check the shell scripts parse
        run: |
          # Check each script with the shell it declares. Not every script here
          # is bash — setup-ci-secrets.sh is zsh, and `bash -n` rejects
          # perfectly good zsh as a syntax error.
          # Not named "status": that is read-only in zsh, so anyone who pastes
          # this loop into a zsh prompt to debug it gets a confusing error.
          failed=0
          for script in build.sh scripts/*.sh; do
            shell="$(head -1 "$script" | sed -n 's|^#!.*/||p')"
            case "$shell" in
              zsh) checker=zsh ;;
              *)   checker=bash ;;
            esac
            if "$checker" -n "$script"; then
              echo "ok    $script ($checker)"
            else
              echo "::error file=$script::$script is not valid $checker"
              failed=1
            fi
          done
          exit $failed

      - name: Build the app bundle
        run: ./build.sh

      - name: Verify the bundle
        run: |
          APP=dist/Mind.app
          test -x "$APP/Contents/MacOS/Mind"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "$APP"

      - name: Verify the disk image builds
        run: ./scripts/make-dmg.sh 0.0.0-ci
